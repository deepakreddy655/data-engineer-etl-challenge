
services:
  localstack:
    image: localstack/localstack:1.2.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kinesis,s3
      - DEFAULT_REGION=us-east-1
      - LS_LOG=WARN
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  article-publisher:
    build: ./populate-script
    volumes:
      - ./populate-script:/app
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - NUM_ITERATIONS=10
      - DATASET_SIZE_MB=1
    depends_on:
      - localstack

  etl-pipeline:
    build: ./populate-script
    volumes:
      - ./pipeline.py:/app/pipeline.py:ro
    working_dir: /app
    command: python pipeline.py
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - localstack
    profiles:
      - etl
